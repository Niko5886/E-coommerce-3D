<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LTX — The world model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --retake-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --retake-slow-ease: cubic-bezier(0.65, 0, 0.35, 1);
    --cap-left: -5px;
    --cap-width: calc(20% + 5px);
    --glass-x: 24%;
    --glass-y: 8%;
    /* Shared muted ink for the "is here" kicker and the bottom-right credit,
       so both render 1:1. This is the soft blue the brand kicker already uses. */
    --sig-ink: #0000ee;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Manrope', system-ui, sans-serif;
    background: #000;
    color: #fff;
    overflow-x: hidden;
    cursor: default;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Only interactive elements show the pointer; no text I-beam over labels/copy. */
  a, button:not(:disabled) { cursor: pointer; }

  ::selection { background: rgba(255, 255, 255, 0.2); }

  :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  button { font-family: 'Manrope', system-ui, sans-serif; }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ─────────────────────────────  STAGE  ───────────────────────────── */
  .stage {
    position: relative;
    isolation: isolate;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #000;
  }

  /* ─────────────────────────────  MEDIA  ───────────────────────────── */
  .media {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 0;
    pointer-events: none;
    visibility: hidden;
  }
  .media.is-visible { visibility: visible; }

  /* ─────────────────────────────  HERO  ───────────────────────────── */
  .hero {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }

  .hero h1 {
    position: absolute;
    top: 35.9%;
    left: 50%;
    transform: translateX(-50%);
    width: min(901px, calc(100vw - 48px));
    margin: 0;
    font-size: clamp(41px, 4.5vw, 67px);
    font-weight: 500;
    line-height: 0.8;
    letter-spacing: -0.04em;
    white-space: nowrap;
    text-align: center;
    text-shadow: 0 2px 12px rgb(0 0 0 / 0.14);
  }

  .hero h1 span {
    display: inline-block;
    transition: opacity 900ms var(--retake-ease),
                filter 900ms var(--retake-ease),
                transform 900ms var(--retake-ease);
  }
  .hero h1 span:nth-child(1) { transition-delay: 0ms; }
  .hero h1 span:nth-child(2) { transition-delay: 90ms; }
  .hero h1 span:nth-child(3) { transition-delay: 180ms; }
  .hero h1 span:nth-child(4) { transition-delay: 270ms; }

  .stage.title-hidden .hero h1 span {
    opacity: 0;
    filter: blur(12px);
    transform: translateY(-10px);
  }

  /* ─────────────────────────────  HEADER  ───────────────────────────── */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 30;
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    padding: calc(58px + env(safe-area-inset-top)) 40px 40px;
    text-shadow: 0 1px 6px rgb(0 0 0 / 0.18);
    pointer-events: none;
  }
  header a, header .try-now { pointer-events: auto; }

  .brand {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
  }
  /* Nik*S wordmark — mirrors the old LTX mark's language: bold, white, tight tracking. */
  .brand .wordmark {
    font-family: 'Manrope', system-ui, sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    color: #fff;
    white-space: nowrap;
    display: inline-block;
  }
  /* AI "spark" — the wordmark's kinetic device. Gradient reuses the glass edge
     accent (cyan -> violet -> pink) so it belongs to the same visual language. */
  .brand .spark {
    display: inline-block;
    width: 0.82em;
    height: 0.82em;
    margin: 0 0.04em;
    vertical-align: 0.02em;
    animation: spark-rot 9s linear infinite;
    will-change: transform;
  }
  .brand .spark svg {
    display: block;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 3px rgb(30 134 224 / 0.6));
    animation: spark-tw 3.6s var(--retake-ease) infinite;
  }
  .brand:hover .spark, .brand:focus-visible .spark { animation-duration: 2.4s; }
  .brand:hover .spark svg, .brand:focus-visible .spark svg {
    filter: drop-shadow(0 0 8px rgb(60 160 255 / 0.9));
  }
  @keyframes spark-rot { to { transform: rotate(360deg); } }
  @keyframes spark-tw { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.82); } }

  /* Uppercase kicker — a modern lockup descriptor beside the wordmark.
     Sibling flex item, vertically centred against the wordmark by align-items. */
  .brand .tagline {
    margin-left: 13px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    line-height: 1;
    color: var(--sig-ink);
    opacity: 0.6;
  }

  .try-now {
    justify-self: end;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 38px;
    padding: 0 22px;
    border-radius: 999px;
    border: 1px solid rgb(255 255 255 / 0.75);
    background: transparent;
    color: #fff;
    font-size: 18px;
    letter-spacing: -0.04em;
    text-decoration: none;
    transition: color 300ms var(--retake-ease),
                background 300ms var(--retake-ease),
                border-color 300ms var(--retake-ease);
  }
  .try-now:hover, .try-now:focus-visible {
    background: #fff;
    color: #0b1a26;
    border-color: #fff;
  }

  /* ─────────────────────────────  CONTROLLER  ───────────────────────────── */
  .controller {
    position: absolute;
    top: 46.78%;
    left: 50%;
    transform: translateX(-50%);
    width: min(880px, calc(100vw - 48px));
    height: 72px;
    z-index: 20;
  }

  .track {
    position: absolute;
    top: 4px;
    left: 0;
    width: 100%;
    height: 64px;
    border-radius: 999px;
    transition: left 980ms var(--retake-slow-ease),
                width 980ms var(--retake-slow-ease),
                opacity 400ms linear;
  }

  .capsule {
    position: absolute;
    top: -1px;
    left: var(--cap-left, -5px);
    width: var(--cap-width, calc(20% + 5px));
    height: 72px;
    border-radius: 999px;
    transition: left 620ms var(--retake-ease),
                width 620ms var(--retake-ease),
                background 980ms var(--retake-slow-ease);
  }

  /* Glass material — .track and .capsule are already position:absolute, which
     establishes the containing block for these pseudo-elements. Do NOT set
     position here or it overrides their absolute positioning. */
  .glass::before, .glass::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
  }
  .glass::before {
    background:
      radial-gradient(120% 150% at var(--glass-x, 24%) var(--glass-y, 8%),
                      rgb(255 255 255 / 0.25), rgb(255 255 255 / 0) 53%),
      linear-gradient(115deg, rgb(255 255 255 / 0.10), rgb(255 255 255 / 0) 42%);
  }
  .glass::after {
    padding: 1px;
    background: conic-gradient(from 225deg, #7fe3ff, rgb(255 255 255 / 0.35), #ffffff,
                               #ffd7e6, rgb(255 255 255 / 0.35), #7fe3ff);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
  }

  .track.glass {
    background: rgb(24 55 82 / 0.31);
    border: 1px solid rgb(255 255 255 / 0.2);
    -webkit-backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
            backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
    box-shadow:
      0 14px 38px rgb(4 24 43 / 0.16),
      0 2px 7px rgb(4 24 43 / 0.1),
      inset 1px 1px 0 rgb(255 255 255 / 0.48),
      inset -1px -1px 0 rgb(21 49 73 / 0.14),
      inset 0 0 0 0.5px rgb(255 255 255 / 0.16);
  }
  .track.glass::after { opacity: 0.27; }

  .capsule.glass {
    background: rgb(246 251 255 / 0.24);
    border: 1px solid rgb(255 255 255 / 0.28);
    -webkit-backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
            backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
    box-shadow:
      0 11px 28px rgb(4 24 43 / 0.17),
      0 2px 6px rgb(4 24 43 / 0.1),
      inset 1px 1px 0 rgb(255 255 255 / 0.62),
      inset -1px -1px 0 rgb(20 49 73 / 0.18),
      inset 0 0 12px rgb(255 255 255 / 0.055);
  }
  .capsule.glass::after { opacity: 0.30; }

  /* Cells */
  .cells {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: center;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 0 14px;
    font-size: 23px;
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: -0.04em;
    white-space: nowrap;
    color: #fff;
    text-shadow: 0 1px 6px rgb(0 0 0 / 0.2);
    transition: opacity 420ms var(--retake-ease),
                filter 420ms var(--retake-ease),
                transform 980ms var(--retake-slow-ease);
  }

  .cell.label { pointer-events: none; }
  .stage.has-hover .cell.label,
  .stage.has-focus .cell.label { opacity: 0.5; }

  button.cell {
    background: transparent;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
  }
  button.cell:disabled { cursor: default; }

  @keyframes reset-reveal {
    from { opacity: 0; filter: blur(10px); }
    to   { opacity: 1; filter: blur(0); }
  }
  .cell.revealing {
    animation: reset-reveal 520ms var(--retake-ease) forwards;
  }

  /* Collapsed / selected states */
  .controller.collapsed .capsule {
    left: calc(50% - 100px);
    width: 200px;
    background: rgb(246 251 255 / 0.14);
  }
  .controller.collapsed .track {
    left: calc(50% - 96px);
    width: 192px;
  }
  .controller.collapsed .track.faded {
    opacity: 0;
    transition: opacity 400ms linear 650ms;
  }

  .controller.collapsed .cell.faded-label {
    opacity: 0;
    filter: blur(10px);
    transform: scale(0.94);
    pointer-events: none;
  }

  /* ─────────────────────────────  CREDIT  ─────────────────────────────
     Subtle bottom-right signature, matching the "is here" muted white. */
  .credit {
    position: absolute;
    right: calc(30px + env(safe-area-inset-right));
    bottom: calc(24px + env(safe-area-inset-bottom));
    z-index: 30;
    display: inline-flex;
    align-items: baseline;
    gap: 0.55em;
    color: var(--sig-ink);
    opacity: 0.6;
    text-shadow: 0 1px 6px rgb(0 0 0 / 0.18);
    pointer-events: none;
    white-space: nowrap;
    -webkit-user-select: none;
            user-select: none;
  }
  .credit-kicker {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.2em;
  }
  .credit-name {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  /* ─────────────────────────────  NOTICE  ───────────────────────────── */
  .notice {
    position: absolute;
    bottom: calc(28px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    display: none;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgb(24 55 82 / 0.55);
    border: 1px solid rgb(255 255 255 / 0.2);
    -webkit-backdrop-filter: blur(9px);
            backdrop-filter: blur(9px);
    font-size: 14px;
    letter-spacing: -0.03em;
  }
  .notice.is-visible { display: inline-flex; }
  .notice button {
    background: #fff;
    color: #0b1a26;
    border: 0;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }

  /* ─────────────────────────────  RESPONSIVE  ───────────────────────────── */
  @media (max-width: 900px) {
    header { padding: calc(24px + env(safe-area-inset-top)) 24px 24px; }
    .try-now { height: 36px; padding: 0 18px; font-size: 14px; }
    .cell { font-size: clamp(17px, 2.5vw, 24px); }
  }

  @media (max-width: 700px) {
    header { padding-left: 18px; padding-right: 18px; }
    .brand .wordmark { font-size: 20px; }
    .credit { right: 16px; bottom: 16px; opacity: 0.5; }
    .credit-kicker { font-size: 9px; }
    .credit-name { font-size: 11px; }
    .try-now {
      position: relative;
      height: 34px; padding: 0 14px; font-size: 13px;
    }
    .try-now::after {
      content: "";
      position: absolute;
      inset: -6px -10px;
    }

    .hero h1 {
      top: 34%;
      width: calc(100vw - 40px);
      font-size: clamp(32px, 9.3vw, 43px);
      line-height: 0.88;
      white-space: normal;
    }

    .controller {
      top: 53%;
      width: calc(100vw - 40px);
      height: 156px;
    }
    .track {
      top: 0;
      height: 156px;
      border-radius: 28px;
    }
    .cells {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 48px 54px 54px;
    }
    .cell.label { grid-column: 1 / -1; }
    .cell {
      font-size: 17px;
      border-right: 1px solid rgb(255 255 255 / 0.12);
      border-bottom: 1px solid rgb(255 255 255 / 0.12);
    }

    .capsule {
      opacity: 0;
      pointer-events: none;
    }
    button.cell:active,
    button.cell:focus-visible {
      outline-offset: -3px;
    }

    .controller.collapsed .capsule {
      opacity: 1;
      left: 50%;
      top: 4vh;
      top: 4dvh;
      transform: translate(-50%, -50%);
      width: 196px;
      height: 64px;
      border-radius: 999px;
      background: rgb(246 251 255 / 0.18);
    }
    .controller.collapsed .track { opacity: 0; }
  }

  @media (max-width: 700px) and (max-height: 700px) {
    .controller { top: 50%; }
  }

  @media (max-height: 520px) and (orientation: landscape) {
    .hero h1 { top: 20%; font-size: clamp(23px, 5.3vh, 37px); }
    .controller { top: 50%; }
  }

  @media (max-width: 700px) and (max-height: 520px) and (orientation: landscape) {
    .hero h1 { top: 12%; font-size: clamp(19px, 4.7vh, 29px); }
    .controller { top: 46%; height: 118px; }
    .track { height: 118px; }
    .cells { grid-template-rows: 36px 41px 41px; }
    .cell { font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .capsule, .track, .cell,
    .hero h1 span, .try-now {
      transition-duration: 1ms !important;
      transition-delay: 0ms !important;
    }
    .stage.title-hidden .hero h1 span { filter: none; }
    .controller.collapsed .cell.faded-label { filter: none; }
    .cell.revealing { animation-duration: 1ms; }
    .brand .spark, .brand .spark svg { animation: none !important; }
  }
</style>
</head>

  };
  var CAPSULE_POS = {
    0: { left: "-5px", width: "calc(20% + 5px)" },
    1: { left: "20%",  width: "20%" },
    2: { left: "40%",  width: "20%" },
    3: { left: "60%",  width: "20%" },
    4: { left: "80%",  width: "calc(20% + 5px)" }
  };

  var hasRVFC = typeof HTMLVideoElement !== "undefined" &&
                !!HTMLVideoElement.prototype.requestVideoFrameCallback;

  // ── State ──
  var scene = "base";                 // base | scene | light | colorway | fullLook
  var playback = "loading";           // loading | ready | starting | playing | error
  var direction = "forward";
  var locked = false;                 // synchronous input lock
  var token = 0;                      // transition token
  var readyPairs = {};                // key -> bool
  var visibleVideo = null;            // currently shown <video>
  var keyboardFocusIndex = 0;         // capsule index held by keyboard focus (0 = none)
  var pendingRetry = null;            // fn to replay last transition

  // pending-transition context, for background-tab pause/resume
  var pending = null;

  function byId(id) { return document.getElementById(id); }
  function announce(msg) { statusEl.textContent = msg; }

  // ─────────────────────────────  READINESS  ─────────────────────────────
  function allVideos() {
    return [CLIPS.scene.fwd, CLIPS.scene.rev, CLIPS.light.fwd, CLIPS.light.rev,
            CLIPS.colorway.fwd, CLIPS.colorway.rev, CLIPS.fullLook.fwd, CLIPS.fullLook.rev];
  }

  function markPairIfReady(key) {
    if (readyPairs[key]) return;
    var c = CLIPS[key];
    if (c.fwd.readyState >= 2 && c.rev.readyState >= 2) {
      readyPairs[key] = true;
      if (BUTTONS[key]) BUTTONS[key].disabled = false;
    }
  }

  function watchReadiness() {
    var keys = ["scene", "light", "colorway", "fullLook"];
    keys.forEach(function (key) {
      // disable until this control's pair is ready
      if (BUTTONS[key]) BUTTONS[key].disabled = true;
      var c = CLIPS[key];
      [c.fwd, c.rev].forEach(function (v) {
        // cached media may never fire loadeddata again -> check up front
        if (v.readyState >= 2) markPairIfReady(key);
        v.addEventListener("loadeddata", function () { markPairIfReady(key); });
        // nudge the network
        try { v.load(); } catch (e) {}
      });
    });
  }

  // Park base = video-1 at frame 0 as the opening visible layer
  function initBaseLayer() {
    var base = CLIPS.colorway.fwd; // video-1.mp4
    function reveal() {
      try { base.currentTime = 0; } catch (e) {}
      showOnly(base);
      visibleVideo = base;
      if (playback === "loading") { playback = "ready"; }
    }
    if (base.readyState >= 2) {
      reveal();
    } else {
      base.addEventListener("loadeddata", reveal, { once: true });
    }
  }

  function showOnly(video) {
    var all = allVideos();
    for (var i = 0; i < all.length; i++) {
      if (all[i] === video) all[i].classList.add("is-visible");
      else all[i].classList.remove("is-visible");
    }
  }

  // ─────────────────────────────  CAPSULE / HOVER  ─────────────────────────────
  function moveCapsuleTo(index) {
    var pos = CAPSULE_POS[index] || CAPSULE_POS[0];
    controller.style.setProperty("--cap-left", pos.left);
    controller.style.setProperty("--cap-width", pos.width);
  }

  function updateHoverClasses() {
    if (keyboardFocusIndex > 0) {
      stage.classList.add("has-focus");
    } else {
      stage.classList.remove("has-focus");
    }
  }

  function bindHover() {
    var buttons = [BUTTONS.scene, BUTTONS.light, BUTTONS.colorway, BUTTONS.fullLook];
    buttons.forEach(function (btn) {
      btn.addEventListener("mouseenter", function () {
        if (locked || scene !== "base") return;
        stage.classList.add("has-hover");
        moveCapsuleTo(parseInt(btn.getAttribute("data-index"), 10));
      });
      btn.addEventListener("focus", function () {
        if (locked || scene !== "base") return;
        keyboardFocusIndex = parseInt(btn.getAttribute("data-index"), 10);
        moveCapsuleTo(keyboardFocusIndex);
        updateHoverClasses();
      });
      btn.addEventListener("blur", function () {
        keyboardFocusIndex = 0;
        updateHoverClasses();
        if (!stage.classList.contains("has-hover") && scene === "base" && !locked) {
          moveCapsuleTo(0);
        }
      });
    });

    controller.addEventListener("mouseleave", function () {
      stage.classList.remove("has-hover");
      if (keyboardFocusIndex === 0 && scene === "base" && !locked) {
        moveCapsuleTo(0);
      }
    });

    // pointer -> glass highlight origin
    controller.addEventListener("pointermove", function (e) {
      var r = controller.getBoundingClientRect();
      var x = ((e.clientX - r.left) / r.width) * 100;
      var y = ((e.clientY - r.top) / r.height) * 100;
      controller.style.setProperty("--glass-x", x.toFixed(1) + "%");
      controller.style.setProperty("--glass-y", y.toFixed(1) + "%");
    });
  }

  // ─────────────────────────────  SEAM-SAFE PLAYER  ─────────────────────────────
  // Wait for a decoded frame from THIS request.
  function awaitFirstFrame(video, myToken) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var rafId = null;
      var timer = null;
      var timeLeft = 12000;
      var timerStart = 0;

      function cleanup() {
        if (rafId) cancelAnimationFrame(rafId);
        if (timer) clearTimeout(timer);
        video.removeEventListener("error", onError);
      }
      function done(ok, err) {
        if (settled) return;
        settled = true;
        cleanup();
        if (ok) resolve(); else reject(err || new Error("frame-timeout"));
      }
      function onError() { done(false, new Error("video-error")); }
      video.addEventListener("error", onError);

      function startTimer() {
        timerStart = Date.now();
        timer = setTimeout(function () {
          if (token !== myToken) { done(false, new Error("stale")); return; }
          done(false, new Error("frame-timeout")); // TIMEOUT IS NEVER SUCCESS
        }, timeLeft);
      }
      function pauseTimer() {
        if (timer) { clearTimeout(timer); timer = null; timeLeft -= (Date.now() - timerStart); if (timeLeft < 0) timeLeft = 0; }
      }

      // expose pause/resume for background-tab handling
      pending = {
        token: myToken,
        video: video,
        pauseTimer: pauseTimer,
        resumeTimer: function () { if (!settled) startTimer(); },
        fail: function () { done(false, new Error("hidden-abort")); }
      };

      if (hasRVFC) {
        var onFrame = function (now, meta) {
          if (settled) return;
          if (token !== myToken) { done(false, new Error("stale")); return; }
          // stale endpoint frame carries a large mediaTime -> keep waiting
          if (meta && meta.mediaTime <= 0.5 && video.readyState >= 2) {
            done(true);
          } else {
            video.requestVideoFrameCallback(onFrame);
          }
        };
        video.requestVideoFrameCallback(onFrame);
      } else {
        var ticks = 0;
        var loop = function () {
          if (settled) return;
          if (token !== myToken) { done(false, new Error("stale")); return; }
          if (video.readyState >= 2 && !video.paused && video.currentTime <= 0.5) {
            ticks++;
            if (ticks >= 2) { done(true); return; } // double-rAF
          }
          rafId = requestAnimationFrame(loop);
        };
        rafId = requestAnimationFrame(loop);
      }

      startTimer();
    });
  }

  function seekToStart(video, myToken) {
    return new Promise(function (resolve, reject) {
      function go() {
        if (video.currentTime > 0.001) {
          var onSeeked = function () {
            video.removeEventListener("seeked", onSeeked);
            resolve();
          };
          video.addEventListener("seeked", onSeeked);
          try { video.currentTime = 0; } catch (e) { resolve(); }
        } else {
          resolve();
        }
      }
      if (token !== myToken) { reject(new Error("stale")); return; }
      go();
    });
  }

  // Monitor active video near its hold time; pause on terminal frame.
  function holdOnTerminalFrame(video, holdSecs, dur, myToken) {
    return new Promise(function (resolve) {
      var target = (dur || video.duration || 0) - holdSecs;
      var frameCb = null;
      var rafId = null;
      var endedFired = false;

      function finish() {
        if (endedFired) return;
        endedFired = true;
        try { video.pause(); } catch (e) {}
        if (rafId) cancelAnimationFrame(rafId);
        video.removeEventListener("ended", onEnded);
        resolve();
      }
      function onEnded() { finish(); } // fallback only
      video.addEventListener("ended", onEnded);

      function check() {
        if (token !== myToken) { if (rafId) cancelAnimationFrame(rafId); return; }
        var d = dur || video.duration || 0;
        var t = (d ? d - holdSecs : target);
        if (video.currentTime >= t) { finish(); return; }
        rafId = requestAnimationFrame(check);
      }
      rafId = requestAnimationFrame(check);
    });
  }

  // ─────────────────────────────  TRANSITIONS  ─────────────────────────────
  function runForward(key) {
    // 1. synchronous lock + disable everything BEFORE any await
    if (locked || scene !== "base") return;
    if (!readyPairs[key]) return;
    locked = true;
    playback = "starting";
    direction = "forward";
    var myToken = ++token;

    hideNotice();
    disableAllButtons(true);
    var srcBtn = BUTTONS[key];
    var hadFocus = (document.activeElement === srcBtn);

    var c = CLIPS[key];
    var targetVideo = c.fwd;

    // collapse choreography (same recalc: collapse + faded)
    collapseController(key);
    animateChosenLabel(key);

    // title hides at ~12% forward progress
    var titleDelay = Math.min((c.fwdDur || 2.08) * 0.12, 0.9) * 1000;
    var titleTimer = setTimeout(function () {
      if (token === myToken) stage.classList.add("title-hidden");
    }, titleDelay);

    announce("Loading " + ORIGINAL_LABEL[key] + " transition");

    playClip(targetVideo, c.fwdDur, DEFAULT_HOLD, myToken)
      .then(function () {
        if (token !== myToken) return;
        // committed selected state
        scene = key;
        playback = "ready";
        locked = false;
        commitSelected(key, hadFocus);
        announce(ORIGINAL_LABEL[key] + " selected. Back to return.");
      })
      .catch(function (err) {
        if (token !== myToken) return;
        clearTimeout(titleTimer);
        onTransitionError(key, function () { runForward(key); });
      });
  }

  function runReverse() {
    if (locked || scene === "base") return;
    var key = scene;
    if (!readyPairs[key]) return;
    locked = true;
    playback = "starting";
    direction = "reverse";
    var myToken = ++token;

    hideNotice();
    disableAllButtons(true);

    var c = CLIPS[key];
    var targetVideo = c.rev;
    var hold = (typeof c.revHold === "number") ? c.revHold : DEFAULT_HOLD;

    // expand the bar in parallel with the reverse clip
    expandController(key);

    announce("Resetting to base");

    playClip(targetVideo, c.revDur, hold, myToken)
      .then(function () {
        if (token !== myToken) return;
        scene = "base";
        playback = "ready";
        locked = false;
        commitBase();
        announce("Base scene");
      })
      .catch(function (err) {
        if (token !== myToken) return;
        onTransitionError(key, function () { /* reverse retry */ runReverse(); }, true);
      });
  }

  // Core player: keep old frame, prep hidden target, reveal only on true first frame.
  function playClip(video, dur, holdSecs, myToken) {
    playback = "playing";
    return seekToStart(video, myToken).then(function () {
      if (token !== myToken) throw new Error("stale");

      // register first-frame BEFORE play(); combine with play() rejection
      var framePromise = awaitFirstFrame(video, myToken);
      var playPromise = Promise.resolve(video.play());

      return Promise.all([playPromise, framePromise]);
    }).then(function () {
      if (token !== myToken) throw new Error("stale");
      // switch visibility atomically (no crossfade)
      showOnly(video);
      visibleVideo = video;
      pending = null;
      return holdOnTerminalFrame(video, holdSecs, dur, myToken);
    });
  }

  // ─────────────────────────────  CHOREOGRAPHY HELPERS  ─────────────────────────────
  function collapseController(key) {
    controller.classList.add("collapsed");
    track.classList.add("faded");
    // fade non-chosen labels
    forEachButton(function (k, btn) {
      if (k !== key) btn.classList.add("faded-label");
    });
    leadLabel.classList.add("faded-label");
  }

  function expandController(key) {
    controller.classList.remove("collapsed");
    track.classList.remove("faded");
    // restore option labels over 760ms after 60ms delay (kept disabled until done)
    setTimeout(function () {
      forEachButton(function (k, btn) {
        btn.classList.remove("faded-label");
        // revert chosen label text back from Back
        if (btn.getAttribute("data-key") === key) {
          setButtonLabel(btn, ORIGINAL_LABEL[key], false);
        }
      });
      leadLabel.classList.remove("faded-label");
    }, 60);
    // capsule returns to index 0
    moveCapsuleTo(0);
    stage.classList.remove("has-hover", "has-focus");
  }

  function animateChosenLabel(key) {
    // chosen label travels to the capsule's FINAL centre. The capsule is still
    // mid-collapse here, so aim at the known destination (controller centre on
    // desktop) rather than the capsule's current animating rect. Record the
    // button's untransformed centre so commit can re-target the settled capsule.
    var btn = BUTTONS[key];
    var btnRect = btn.getBoundingClientRect();
    btn._baseCX = btnRect.left + btnRect.width / 2;
    btn._baseCY = btnRect.top + btnRect.height / 2;
    var cRect = controller.getBoundingClientRect();
    var dx = (cRect.left + cRect.width / 2) - btn._baseCX;
    var dy = (cRect.top + cRect.height / 2) - btn._baseCY;
    btn.style.transform = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px)";
  }

  function commitSelected(key, hadFocus) {
    var btn = BUTTONS[key];
    // Re-target the now-settled capsule so "Back" is centred on every breakpoint.
    var capRect = capsule.getBoundingClientRect();
    var baseCX = (typeof btn._baseCX === "number") ? btn._baseCX
      : (btn.getBoundingClientRect().left + btn.getBoundingClientRect().width / 2);
    var baseCY = (typeof btn._baseCY === "number") ? btn._baseCY
      : (btn.getBoundingClientRect().top + btn.getBoundingClientRect().height / 2);
    var dx = (capRect.left + capRect.width / 2) - baseCX;
    var dy = (capRect.top + capRect.height / 2) - baseCY;
    btn.style.transform = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px)";
    setButtonLabel(btn, "Back", true);
    btn.disabled = false;                    // Back must be actionable
    // other buttons: disabled, aria-hidden, tabindex -1
    forEachButton(function (k, b) {
      if (k !== key) {
        b.disabled = true;
        b.setAttribute("aria-hidden", "true");
        b.setAttribute("tabindex", "-1");
      }
    });
    if (hadFocus) {
      try { btn.focus({ preventScroll: true }); } catch (e) { btn.focus(); }
    }
  }

  function commitBase() {
    // fully restore controller
    controller.classList.remove("collapsed");
    track.classList.remove("faded");
    forEachButton(function (k, b) {
      b.disabled = false;
      b.removeAttribute("aria-hidden");
      b.removeAttribute("tabindex");
      b.classList.remove("faded-label");
      b.style.transform = "";
      setButtonLabel(b, ORIGINAL_LABEL[k], false);
    });
    leadLabel.classList.remove("faded-label");
    moveCapsuleTo(0);
    // reveal title now that base commits
    stage.classList.remove("title-hidden");
  }

  function setButtonLabel(btn, text, isReset) {
    btn.textContent = text;
    if (isReset) {
      btn.classList.add("revealing");
      setTimeout(function () { btn.classList.remove("revealing"); }, 560);
    } else {
      btn.classList.remove("revealing");
    }
  }

  // ─────────────────────────────  ERROR HANDLING  ─────────────────────────────
  function onTransitionError(key, retryFn, isReverse) {
    playback = "error";
    locked = false;
    pending = null;
    // preserve last valid frame; do not claim success
    disableAllButtons(false);
    pendingRetry = retryFn;
    noticeText.textContent = "Couldn't play the " + (ORIGINAL_LABEL[key] || "") + " transition.";
    notice.classList.add("is-visible");
    announce("Transition failed. Retry available.");
  }

  function hideNotice() {
    notice.classList.remove("is-visible");
    pendingRetry = null;
  }

  // ─────────────────────────────  UTILITIES  ─────────────────────────────
  function forEachButton(fn) {
    ["scene", "light", "colorway", "fullLook"].forEach(function (k) {
      fn(k, BUTTONS[k]);
    });
  }

  function disableAllButtons(state) {
    forEachButton(function (k, b) { b.disabled = state; });
  }

  // ─────────────────────────────  EVENTS  ─────────────────────────────
  function bindClicks() {
    forEachButton(function (key, btn) {
      btn.addEventListener("click", function () {
        // Reset path
        if (scene === key) { runReverse(); return; }
        // branch-to-branch not allowed
        if (scene !== "base") return;
        runForward(key);
      });
    });

    retryBtn.addEventListener("click", function () {
      var fn = pendingRetry;
      hideNotice();
      if (fn) fn();
    });
  }

  // Background-tab handling: freeze deadline; pause+rewind pending clip.
  function bindVisibility() {
    document.addEventListener("visibilitychange", function () {
      if (!pending) return;
      if (document.hidden) {
        pending.pauseTimer();
        try { pending.video.pause(); pending.video.currentTime = 0; } catch (e) {}
      } else {
        // restart the timer and replay
        try { pending.video.play(); } catch (e) {}
        pending.resumeTimer();
      }
    });
  }

  // ─────────────────────────────  INIT  ─────────────────────────────
  function init() {
    moveCapsuleTo(0);
    watchReadiness();
    initBaseLayer();
    bindHover();
    bindClicks();
    bindVisibility();
    announce("Loading scene");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
